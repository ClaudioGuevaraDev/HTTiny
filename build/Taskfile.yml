version: '3'

tasks:
  # Required by the platform build tasks in windows/, darwin/ and linux/, which
  # all declare `common:go:mod:tidy` and `common:generate:icons` as deps.
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  generate:icons:
    summary: Generates the Windows `.ico` and macOS `.icns` from build/appicon.png
    run: once
    dir: build
    sources: [appicon.png]
    generates:
      - windows/icon.ico
      - darwin/icons.icns
    # Deliberately without `-iconcomposerinput` / `-macassetdir`, which the stock
    # template passes: they need an `appicon.icon` bundle this project does not
    # keep, and `create:app:bundle` copies Assets.car only when it exists.
    cmds:
      - wails3 generate icons -input appicon.png -windowsfilename windows/icon.ico -macfilename darwin/icons.icns

  install:frontend:deps:
    summary: Installs frontend dependencies
    dir: frontend
    sources: [package.json, pnpm-lock.yaml]
    generates: [node_modules/**/*]
    cmds:
      - pnpm install --frozen-lockfile

  generate:bindings:
    summary: Generates TypeScript bindings for the bound Go services
    sources:
      - '*.go'
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*.ts
    cmds:
      # -i emits plain interfaces instead of classes: these DTOs are pure JSON, so
      # the class variant only adds runtime construction helpers nothing calls.
      - wails3 generate bindings -ts -i -d frontend/bindings ./...

  build:frontend:
    summary: Builds the React frontend
    dir: frontend
    deps: [install:frontend:deps]
    sources:
      - src/**/*
      - bindings/**/*
      - index.html
      - package.json
      - vite.config.ts
      - eslint.config.js
      - .prettierrc.json
      - .prettierignore
    generates: [dist/**/*]
    cmds:
      - pnpm run build

  dev:frontend:
    summary: Runs the Vite development server
    dir: frontend
    deps: [install:frontend:deps]
    cmds:
      - pnpm run dev -- --port {{.VITE_PORT}} --strictPort

