version: '3'

tasks:
  install:frontend:deps:
    summary: Installs frontend dependencies
    dir: frontend
    sources: [package.json, pnpm-lock.yaml]
    generates: [node_modules/**/*]
    cmds:
      - pnpm install --frozen-lockfile

  generate:bindings:
    summary: Generates TypeScript bindings for the bound Go services
    sources:
      - '*.go'
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*.ts
    cmds:
      # -i emits plain interfaces instead of classes: these DTOs are pure JSON, so
      # the class variant only adds runtime construction helpers nothing calls.
      - wails3 generate bindings -ts -i -d frontend/bindings ./...

  build:frontend:
    summary: Builds the React frontend
    dir: frontend
    deps: [install:frontend:deps]
    sources:
      - src/**/*
      - bindings/**/*
      - index.html
      - package.json
      - vite.config.ts
      - eslint.config.js
      - .prettierrc.json
      - .prettierignore
    generates: [dist/**/*]
    cmds:
      - pnpm run build

  dev:frontend:
    summary: Runs the Vite development server
    dir: frontend
    deps: [install:frontend:deps]
    cmds:
      - pnpm run dev -- --port {{.VITE_PORT}} --strictPort

