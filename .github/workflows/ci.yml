name: CI

# The gates AGENTS.md asks for before submitting, run on every change instead of
# only on the developer's machine. Nothing here publishes anything.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS3_VERSION: v3.0.0-beta.8
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # The gate that matters: typescript-eslint does not emit tsc diagnostics, so
      # this script chains `tsc -b` before eslint and reports both.
      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
          - platform: macos-latest
            name: macos
          - platform: ubuntu-24.04
            name: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            build-essential \
            pkg-config

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Build
        run: wails3 task build

      # frontend/bindings/ is generated but committed, because it is an input to
      # the TypeScript build. The build above regenerates it, so a diff here means
      # a bound Go signature changed without the bindings being regenerated.
      - name: Check the committed bindings are current
        shell: bash
        run: |
          if ! git diff --exit-code -- frontend/bindings; then
            echo "::error::frontend/bindings is stale — run 'wails3 task common:generate:bindings' and commit the result"
            exit 1
          fi
