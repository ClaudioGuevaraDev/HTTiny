<!doctype html>
<!-- The pre-hydration default only. `language.ts` rewrites `lang` from the stored
     preference before the first render, the way `theme.ts` writes `data-theme`. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" href="/httiny-mark.svg" />
    <title>HTTiny</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
